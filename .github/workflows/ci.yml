              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-yaml'

  lint-systemd:
    name: lint-systemd
    runs-on: ubuntu-latest
    needs: [build-devcontainer-lint]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
