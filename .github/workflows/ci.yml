---
name: ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch/tag/SHA). Defaults to the current ref."
        required: false
        type: string
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint-permissions:
    name: lint-permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-permissions'

  lint-naming:
    name: lint-naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-naming'

  lint-sh:
    name: lint-sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-sh'

  test-all:
    name: test-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh tests'

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    needs: [test-all]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh coverage'

      - name: Show kcov output paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing coverage/ (if present)"
          ls -la coverage || true
          echo "Searching for coverage.json under coverage/"
          find coverage -maxdepth 4 -name coverage.json -print 2>/dev/null || true
          echo "Searching for kcov logs under coverage/"
          find coverage -maxdepth 2 -name '*.log' -print 2>/dev/null || true

      - name: Show kcov log tails (failure only)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for f in coverage/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f (last 200 lines) ---"
            tail -n 200 "$f" || true
          done

      - name: Upload kcov coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Upload kcov logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-logs
          path: |
            coverage/*.log
            coverage/**/*.log
            coverage/*.strace
            coverage/**/*.strace
          if-no-files-found: warn

  # Coverage enforcement is handled by ./scripts/ci.sh coverage

  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-yaml'

  lint-systemd:
    name: lint-systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-systemd'

  lint-markdown:
    name: lint-markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: kiosk-retropie-devcontainer:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh lint-markdown'

  runner-unit-tests:
    name: runner-unit-tests (no container)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - lint-permissions
      - lint-naming
      - lint-sh
      - lint-yaml
      - lint-systemd
      - lint-markdown
      - test-all
      - test-coverage
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests on runner
        shell: bash
        run: |
          set -euo pipefail
          ./tests/bin/run-bats-unit.sh

  arm64-hw-integration:
    name: arm64-hw-integration (self-hosted Linux ARM64)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    needs:
      - lint-permissions
      - lint-naming
      - lint-sh
      - lint-yaml
      - lint-systemd
      - lint-markdown
      - test-all
    # SECURITY: never run untrusted fork PR code on a self-hosted runner.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Host info (Raspberry Pi OS sanity)
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release || true
          bash --version | head -n 1
          systemctl --version | head -n 1 || true

      - name: Ensure passwordless sudo (required for sysfs hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sudo >/dev/null 2>&1; then
            echo "sudo is required on the self-hosted runner for hardware tests" >&2
            exit 1
          fi
          if ! sudo -n true >/dev/null 2>&1; then
            echo "Hardware tests need passwordless sudo to write /sys (LEDs/backlight)." >&2
            echo "Configure the runner user with NOPASSWD for sudo, then re-run." >&2
            exit 1
          fi

      - name: Install required systemd units (for HW tests)
        shell: bash
        run: |
          set -euo pipefail
          systemd_dir=/etc/systemd/system
          sudo -n install -d "$systemd_dir"
          sudo -n install -m 0644 \
            systemd/kiosk-retropie-led-mqtt.service \
            "$systemd_dir/kiosk-retropie-led-mqtt.service"
          sudo -n install -m 0644 \
            systemd/kiosk-retropie-screen-brightness-mqtt.service \
            "$systemd_dir/kiosk-retropie-screen-brightness-mqtt.service"
          sudo -n systemctl daemon-reload

      - name: Ensure MQTT tooling (required for MQTT bridge hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for cmd in mosquitto mosquitto_pub mosquitto_sub; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing+=("$cmd")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing MQTT tooling: ${missing[*]}" >&2

            if command -v apt-get >/dev/null 2>&1; then
              echo "Installing mosquitto tooling via apt-get..." >&2
              sudo -n apt-get update
              sudo -n apt-get install -y mosquitto mosquitto-clients
            else
              echo "Cannot auto-install because apt-get is unavailable." >&2
              echo "Install mosquitto + clients on the runner, then re-run." >&2
              exit 1
            fi
          fi

          for cmd in mosquitto mosquitto_pub mosquitto_sub; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "MQTT tooling still missing after install: $cmd" >&2
              exit 1
            }
          done

      - name: Ensure uinput device (required for controller hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          if command -v modprobe >/dev/null 2>&1; then
            # Ensure input modules are loaded so uinput devices appear under /dev/input/event*.
            sudo -n modprobe uinput 2>/dev/null || true
            sudo -n modprobe evdev 2>/dev/null || true
          fi
          if [[ ! -e /dev/uinput ]]; then
            echo "Missing /dev/uinput on runner." >&2
            echo "Load it with: sudo modprobe uinput" >&2
            echo "To persist: ensure uinput module loads at boot." >&2
            exit 1
          fi

      - name: Run HW integration tests
        shell: bash
        run: |
          set -euo pipefail
          export KIOSK_RETROPIE_HW_REQUIRE_UNITS=1
          export KIOSK_RETROPIE_HW_REQUIRE_UINPUT=1
          sudo -E bash ./tests/bin/run-bats-hw.sh
