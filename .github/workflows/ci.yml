      - name: Upload unit paths log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paths-log-unit
          path: tests/.tmp/kiosk-retropie-paths.unit.log
          if-no-files-found: warn

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        id: devcontainer
        shell: bash
        run: |
          set -euo pipefail
          pulled=false
          for i in {1..12}; do
            if docker pull "${DEVCONTAINER_IMAGE}"; then
              pulled=true
              break
            fi
            sleep 10
          done
          echo "pulled=$pulled" >> "$GITHUB_OUTPUT"
          if [[ "$pulled" == "true" ]]; then
            docker tag "${DEVCONTAINER_IMAGE}" "${DEVCONTAINER_LOCAL_TAG}"
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.devcontainer.outputs.pulled != 'true' }}
