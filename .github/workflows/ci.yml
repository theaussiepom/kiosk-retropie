---
name: ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch/tag/SHA). Defaults to the current ref."
        required: false
        type: string
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: read

env:
  DEVCONTAINER_IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/kr-devcontainer
  DEVCONTAINER_LOCAL_TAG: kiosk-retropie-devcontainer:ci
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-devcontainer-tests:
    name: build-devcontainer-tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if devcontainer image already exists
        id: image_exists
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-tests-${{ env.IMAGE_TAG }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build devcontainer image (tests)
        if: ${{ steps.image_exists.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/dockerfile.ci
          target: tests
          tags: >-
            ${{ env.DEVCONTAINER_IMAGE_BASE }}:ci-tests-${{ env.IMAGE_TAG }}
          labels: >-
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-devcontainer-coverage:
    name: build-devcontainer-coverage
    runs-on: ubuntu-latest
    needs: [build-devcontainer-tests]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if devcontainer image already exists
        id: image_exists
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build devcontainer image (coverage)
        if: ${{ steps.image_exists.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/dockerfile.ci
          target: coverage
          tags: >-
            ${{ env.DEVCONTAINER_IMAGE_BASE }}:ci-coverage-${{ env.IMAGE_TAG }}
          labels: >-
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-devcontainer-lint:
    name: build-devcontainer-lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build lint devcontainer images (parallel)
        shell: bash
        run: |
          set -euo pipefail

          build_if_missing() {
            local target="$1"
            local suffix="$2"
            local image="${DEVCONTAINER_IMAGE_BASE}:ci-${suffix}-${{ env.IMAGE_TAG }}"

            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Already exists: $image"
              return 0
            fi

            echo "Building: $image (target=$target)"
            docker buildx build \
              --file .devcontainer/dockerfile.ci \
              --target "$target" \
              --tag "$image" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --push \
              --cache-from "type=gha,scope=ci-${suffix}" \
              --cache-to "type=gha,mode=max,scope=ci-${suffix}" \
              . &

            pids+=("$!")
            names+=("$suffix")
          }

          declare -a pids=()
          declare -a names=()

          build_if_missing base lint-base
          build_if_missing lint-sh lint-sh
          build_if_missing lint-yaml lint-yaml
          build_if_missing lint-systemd lint-systemd
          build_if_missing lint-markdown lint-markdown

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "Build failed: ${names[$i]}" >&2
              failed=1
            fi
          done

          exit "$failed"

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [build-devcontainer-lint]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint stages in devcontainers
        shell: bash
        run: |
          set -euo pipefail

          pull_with_retries() {
            local image="$1"
            for i in {1..12}; do
              if docker pull "$image"; then
                return 0
              fi
              sleep 10
            done
            echo "Failed to pull devcontainer image: $image" >&2
            return 1
          }

          run_in_image() {
            local image="$1"
            shift

            pull_with_retries "$image"
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "$image" \
              bash -lc "git config --global --add safe.directory /work && $*"
          }

          base_image="${DEVCONTAINER_IMAGE_BASE}:ci-lint-base-${{ env.IMAGE_TAG }}"
          sh_image="${DEVCONTAINER_IMAGE_BASE}:ci-lint-sh-${{ env.IMAGE_TAG }}"
          yaml_image="${DEVCONTAINER_IMAGE_BASE}:ci-lint-yaml-${{ env.IMAGE_TAG }}"
          systemd_image="${DEVCONTAINER_IMAGE_BASE}:ci-lint-systemd-${{ env.IMAGE_TAG }}"
          markdown_image="${DEVCONTAINER_IMAGE_BASE}:ci-lint-markdown-${{ env.IMAGE_TAG }}"

          run_bg() {
            local name="$1"
            local image="$2"
            shift 2

            echo "== $name =="
            run_in_image "$image" "$@" &
            pids+=("$!")
            names+=("$name")
          }

          declare -a pids=()
          declare -a names=()

          run_bg lint-permissions "$base_image" ./scripts/ci.sh lint-permissions
          run_bg lint-naming "$base_image" ./scripts/ci.sh lint-naming
          run_bg lint-sh "$sh_image" ./scripts/ci.sh lint-sh
          run_bg lint-yaml "$yaml_image" ./scripts/ci.sh lint-yaml
          run_bg lint-systemd "$systemd_image" ./scripts/ci.sh lint-systemd
          run_bg lint-markdown "$markdown_image" ./scripts/ci.sh lint-markdown

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "Lint failed: ${names[$i]}" >&2
              failed=1
            fi
          done

          exit "$failed"

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [build-devcontainer-tests]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-tests-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh tests'

      - name: Upload unit paths log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paths-log-unit
          path: tests/.tmp/kiosk-retropie-paths.unit.log
          if-no-files-found: warn

      - name: Upload integration paths log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paths-log-integration
          path: tests/.tmp/kiosk-retropie-paths.log
          if-no-files-found: warn

  test-hardware-arm64:
    name: test-hardware-arm64
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    # SECURITY: never run untrusted fork PR code on a self-hosted runner.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Host info (Raspberry Pi OS sanity)
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release || true
          bash --version | head -n 1
          systemctl --version | head -n 1 || true

      - name: Ensure passwordless sudo (required for sysfs hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sudo >/dev/null 2>&1; then
            echo "sudo is required on the self-hosted runner for hardware tests" >&2
            exit 1
          fi
          if ! sudo -n true >/dev/null 2>&1; then
            echo "Hardware tests need passwordless sudo to write /sys (LEDs/backlight)." >&2
            echo "Configure the runner user with NOPASSWD for sudo, then re-run." >&2
            exit 1
          fi

      - name: Ensure retropi user (required for VT/Xorg hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          if id -u retropi >/dev/null 2>&1; then
            exit 0
          fi
          echo "Creating user retropi for hardware tests" >&2
          sudo -n useradd -m -s /bin/bash retropi

      - name: Ensure retropi device groups (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          # Some distros gate access to /dev/dri and input devices via groups.
          for grp in video render input; do
            if getent group "$grp" >/dev/null 2>&1; then
              sudo -n usermod -aG "$grp" retropi
            fi
          done

      - name: Stop display manager (free VTs for tty7/tty8)
        shell: bash
        run: |
          set -euo pipefail
          echo "DISPLAY_MANAGER_WAS_ACTIVE=0" >> "$GITHUB_ENV"
          if systemctl list-unit-files --type=service | awk '{print $1}' | grep -qx 'display-manager.service'; then
            if systemctl is-active --quiet display-manager.service; then
              echo "Stopping display-manager.service to free VT7/VT8" >&2
              echo "DISPLAY_MANAGER_WAS_ACTIVE=1" >> "$GITHUB_ENV"
              sudo -n systemctl stop display-manager.service
            fi
          fi

      - name: Ensure VT/Xorg tooling (required for tty7/tty8 smoke tests)
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for cmd in chvt fgconsole xinit; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing+=("$cmd")
            fi
          done
          if [[ ! -x /usr/lib/xorg/Xorg ]]; then
            missing+=("/usr/lib/xorg/Xorg")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "Missing VT/Xorg tooling: ${missing[*]}" >&2
            if command -v apt-get >/dev/null 2>&1; then
              sudo -n apt-get update
              # chvt/fgconsole -> kbd
              # xinit + Xorg -> xinit + xserver-xorg
              # xauth is commonly invoked by xinit.
              sudo -n apt-get install -y kbd xauth xinit xserver-xorg
            else
              echo "Cannot auto-install because apt-get is unavailable." >&2
              exit 1
            fi
          fi

          for cmd in chvt fgconsole xinit; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "VT/Xorg tooling still missing after install: $cmd" >&2
              exit 1
            }
          done
          [[ -x /usr/lib/xorg/Xorg ]] || {
            echo "VT/Xorg tooling still missing after install: /usr/lib/xorg/Xorg" >&2
            exit 1
          }

      - name: Install required systemd units (for HW tests)
        shell: bash
        run: |
          set -euo pipefail
          systemd_dir=/etc/systemd/system
          sudo -n install -d "$systemd_dir"
          sudo -n install -m 0644 \
            systemd/kiosk-retropie-led-mqtt.service \
            "$systemd_dir/kiosk-retropie-led-mqtt.service"
          sudo -n install -m 0644 \
            systemd/kiosk-retropie-screen-brightness-mqtt.service \
            "$systemd_dir/kiosk-retropie-screen-brightness-mqtt.service"
          sudo -n install -m 0644 \
            systemd/kiosk-retropie-home-assistant-mqtt.service \
            "$systemd_dir/kiosk-retropie-home-assistant-mqtt.service"

          # Install the scripts expected by these units.
          lib_dir=/usr/local/lib/kiosk-retropie
          sudo -n install -d "$lib_dir" "$lib_dir/lib"
          sudo -n install -m 0755 scripts/lib/common.sh "$lib_dir/lib/common.sh"
          sudo -n install -m 0755 scripts/lib/logging.sh "$lib_dir/lib/logging.sh"
          sudo -n install -m 0755 scripts/lib/path.sh "$lib_dir/lib/path.sh"
          sudo -n install -m 0755 scripts/mqtt/home-assistant-mqtt.sh "$lib_dir/kiosk-retropie-home-assistant-mqtt.sh"
          sudo -n systemctl daemon-reload

      - name: Ensure MQTT tooling (required for MQTT bridge hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for cmd in mosquitto mosquitto_pub mosquitto_sub; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing+=("$cmd")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing MQTT tooling: ${missing[*]}" >&2

            if command -v apt-get >/dev/null 2>&1; then
              echo "Installing mosquitto tooling via apt-get..." >&2
              sudo -n apt-get update
              sudo -n apt-get install -y mosquitto mosquitto-clients
            else
              echo "Cannot auto-install because apt-get is unavailable." >&2
              echo "Install mosquitto + clients on the runner, then re-run." >&2
              exit 1
            fi
          fi

          for cmd in mosquitto mosquitto_pub mosquitto_sub; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "MQTT tooling still missing after install: $cmd" >&2
              exit 1
            }
          done

      - name: Ensure uinput device (required for controller hardware tests)
        shell: bash
        run: |
          set -euo pipefail
          if command -v modprobe >/dev/null 2>&1; then
            # Ensure input modules are loaded so uinput devices appear under /dev/input/event*.
            sudo -n modprobe uinput 2>/dev/null || true
            sudo -n modprobe evdev 2>/dev/null || true
          fi
          if [[ ! -e /dev/uinput ]]; then
            echo "Missing /dev/uinput on runner." >&2
            echo "Load it with: sudo modprobe uinput" >&2
            echo "To persist: ensure uinput module loads at boot." >&2
            exit 1
          fi

      - name: Run HW integration tests
        shell: bash
        run: |
          set -euo pipefail
          export KIOSK_RETROPIE_HW_REQUIRE_UNITS=1
          export KIOSK_RETROPIE_HW_REQUIRE_UINPUT=1
          export KIOSK_RETROPIE_HW_REQUIRE_VT_XORG=1
          sudo -E bash ./tests/bin/run-bats-hw.sh

      - name: Restart display manager (cleanup)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DISPLAY_MANAGER_WAS_ACTIVE:-0}" == "1" ]]; then
            echo "Restarting display-manager.service (was active before tests)" >&2
            sudo -n systemctl start display-manager.service || true
          fi

  test-coverage-path:
    name: test-coverage-path
    runs-on: ubuntu-latest
    needs: [build-devcontainer-tests, test]
    steps:
      - uses: actions/checkout@v4

      - name: Download unit paths log
        uses: actions/download-artifact@v4
        with:
          name: paths-log-unit
          path: tests/.tmp/

      - name: Download integration paths log
        uses: actions/download-artifact@v4
        with:
          name: paths-log-integration
          path: tests/.tmp/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-tests-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run stage in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc './scripts/ci.sh tests-path-coverage'

  test-coverage-line:
    name: test-coverage-line (merge)
    runs-on: ubuntu-latest
    needs:
      [
        build-devcontainer-coverage,
        test,
        test-coverage-line-bats,
        test-coverage-line-scripts,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Download kcov bats part
        uses: actions/download-artifact@v4
        with:
          name: kcov-part-bats
          path: tests/.tmp/kcov-merge-input

      - name: Download kcov scripts part
        uses: actions/download-artifact@v4
        with:
          name: kcov-part-scripts
          path: tests/.tmp/kcov-merge-input

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run stage in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc '
              set -euo pipefail
              export KCOV_OUT_DIR=/work/tests/.tmp/kcov-merge-out
              export KCOV_MERGE_BATS_DIR=/work/tests/.tmp/kcov-merge-input/bats
              export KCOV_MERGE_COVERAGE_DIR=/work/tests/.tmp/kcov-merge-input/coverage
              export KCOV_MERGE_WRAPPED_DIR=/work/tests/.tmp/kcov-merge-input/coverage-wrapped/kcov-merged
              ./scripts/ci.sh coverage-merge
            '

      - name: Show kcov output paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing coverage/ (if present)"
          ls -la coverage || true
          echo "Searching for coverage.json under coverage/"
          find coverage -maxdepth 4 -name coverage.json -print 2>/dev/null || true
          echo "Searching for kcov logs under coverage/"
          find coverage -maxdepth 2 -name '*.log' -print 2>/dev/null || true

      - name: Show kcov log tails (failure only)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for f in coverage/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f (last 200 lines) ---"
            tail -n 200 "$f" || true
          done

      - name: Upload kcov coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-coverage
          path: tests/.tmp/kcov-merge-out/
          if-no-files-found: warn

      - name: Upload kcov logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-logs
          path: |
            tests/.tmp/kcov-merge-out/*.log
            tests/.tmp/kcov-merge-out/**/*.log
            tests/.tmp/kcov-merge-out/*.strace
            tests/.tmp/kcov-merge-out/**/*.strace
          if-no-files-found: warn

  test-coverage-line-bats:
    name: test-coverage-line (bats)
    runs-on: ubuntu-latest
    needs: [build-devcontainer-coverage, test]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run kcov bats part in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/.tmp/kcov-part-bats
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc 'export KCOV_OUT_DIR=/work/tests/.tmp/kcov-part-bats && ./scripts/ci.sh coverage-bats'

      - name: Upload kcov bats part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-part-bats
          path: tests/.tmp/kcov-part-bats/
          if-no-files-found: error

  test-coverage-line-scripts:
    name: test-coverage-line (scripts)
    runs-on: ubuntu-latest
    needs: [build-devcontainer-coverage, test]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run kcov scripts part in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/.tmp/kcov-part-scripts
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc 'export KCOV_OUT_DIR=/work/tests/.tmp/kcov-part-scripts && ./scripts/ci.sh coverage-scripts'

      - name: Upload kcov scripts part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-part-scripts
          path: tests/.tmp/kcov-part-scripts/
          if-no-files-found: error
