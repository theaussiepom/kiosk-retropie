            bash -lc './scripts/ci.sh lint-systemd'

  lint-markdown:
    name: lint-markdown
    runs-on: ubuntu-latest
    needs: [build-devcontainer-lint]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
