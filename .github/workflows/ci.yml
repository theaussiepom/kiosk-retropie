          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc 'export KCOV_OUT_DIR=/work/tests/.tmp/kcov-part-scripts && ./scripts/ci.sh coverage-scripts'

      - name: Upload kcov scripts part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-part-scripts
          path: tests/.tmp/kcov-part-scripts/*
          if-no-files-found: error

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    needs:
      [
        build-devcontainer-test,
        test-coverage-line-bats-unit,
        test-coverage-line-bats-integration,
        test-coverage-line-scripts,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Download unit paths log
        uses: actions/download-artifact@v4
        with:
          name: paths-log-unit
          path: tests/.tmp/

      - name: Download integration paths log
        uses: actions/download-artifact@v4
        with:
          name: paths-log-integration
          path: tests/.tmp/

      - name: Download kcov bats (unit) part
        uses: actions/download-artifact@v4
        with:
          name: kcov-part-bats-unit
          path: tests/.tmp/kcov-merge-input/bats-unit

      - name: Download kcov bats (integration) part
        uses: actions/download-artifact@v4
        with:
          name: kcov-part-bats-integration
          path: tests/.tmp/kcov-merge-input/bats-integration

      - name: Download kcov scripts part
        uses: actions/download-artifact@v4
        with:
          name: kcov-part-scripts
          path: tests/.tmp/kcov-merge-input

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Verify required PATH ids
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci.sh tests-path-coverage

      - name: Run stage in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc '
              set -euo pipefail

              merge_input=/work/tests/.tmp/kcov-merge-input

              bats_unit_dir="$(
                find "$merge_input/bats-unit" -maxdepth 8 -type f -name index.html -print -quit \
                  | xargs -r dirname
              )"
              if [[ -z "$bats_unit_dir" ]]; then
                echo "Could not locate bats unit kcov output under: $merge_input/bats-unit" >&2
                find "$merge_input/bats-unit" -maxdepth 4 -print >&2 || true
                exit 1
              fi

              bats_integration_dir="$(
                find "$merge_input/bats-integration" -maxdepth 8 -type f -name index.html -print -quit \
                  | xargs -r dirname
              )"
              if [[ -z "$bats_integration_dir" ]]; then
                echo "Could not locate bats integration kcov output under: $merge_input/bats-integration" >&2
                find "$merge_input/bats-integration" -maxdepth 4 -print >&2 || true
                exit 1
              fi

              wrapped_dir="$(
                find "$merge_input" -maxdepth 10 -type d -path "*/coverage-wrapped/kcov-merged" -print -quit
              )"
              if [[ -z "$wrapped_dir" ]]; then
                echo "Could not locate scripts wrapped merge dir under: $merge_input" >&2
                find "$merge_input" -maxdepth 4 -print >&2 || true
                exit 1
              fi

              # kcov writes coverage.json under a per-command subdirectory, not directly under the
              # coverage output directory. Locate the kcov-line-coverage output robustly.
              scripts_coverage_leaf_dir="$(
                find "$merge_input" -maxdepth 10 -type f -name coverage.json \
                  -path "*/kcov-line-coverage.sh.*/*" \
                  -not -path "*/coverage-wrapped/*" \
                  -print -quit \
                  | xargs -r dirname
              )"
              if [[ -z "$scripts_coverage_leaf_dir" ]]; then
                echo "Could not locate scripts kcov-line coverage.json under: $merge_input" >&2
                find "$merge_input" -maxdepth 4 -print >&2 || true
                exit 1
              fi

              scripts_coverage_dir="$(dirname "$scripts_coverage_leaf_dir")"
              if [[ ! -f "$scripts_coverage_dir/index.html" ]]; then
                echo "Could not locate scripts kcov-line index.html at: $scripts_coverage_dir/index.html" >&2
                find "$scripts_coverage_dir" -maxdepth 2 -print >&2 || true
                exit 1
              fi

              export KCOV_OUT_DIR=/work/tests/.tmp/kcov-merge-out
              export KCOV_MERGE_BATS_DIRS="$(
                printf "%s,%s" "$bats_unit_dir" "$bats_integration_dir"
              )"
              export KCOV_MERGE_COVERAGE_DIR="$scripts_coverage_dir"
              export KCOV_MERGE_WRAPPED_DIR="$wrapped_dir"
              ./scripts/ci.sh coverage-merge
            '

      - name: Show kcov output paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing tests/.tmp/kcov-merge-out/"
          find tests/.tmp/kcov-merge-out -maxdepth 4 -type f -print | sed 's#^#  #' || true

      - name: Verify kcov output exists
        shell: bash
        run: |
          set -euo pipefail
          test -d tests/.tmp/kcov-merge-out
          test -d tests/.tmp/kcov-merge-out/kcov-merged
          test -f tests/.tmp/kcov-merge-out/kcov-merged/index.html
          test -f tests/.tmp/kcov-merge-out/kcov-merged/kcov-merged/coverage.json

      - name: Collect kcov output for debugging
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage

          # kcov emits logs in the merge output directory.
          find tests/.tmp/kcov-merge-out -maxdepth 2 -name '*.log' -print -exec cp -v '{}' coverage/ ';' || true

      - name: Show kcov output summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing coverage/ (if present)"
          ls -la coverage || true
          echo "Searching for coverage.json under coverage/"
          find coverage -maxdepth 4 -name coverage.json -print 2>/dev/null || true
          echo "Searching for kcov logs under coverage/"
          find coverage -maxdepth 2 -name '*.log' -print 2>/dev/null || true

      - name: Show kcov log tails (failure only)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for f in coverage/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f (last 200 lines) ---"
            tail -n 200 "$f" || true
          done

      - name: Upload kcov coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-coverage
          path: tests/.tmp/kcov-merge-out/
          if-no-files-found: warn

      - name: Upload kcov logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-logs
          path: |
            tests/.tmp/kcov-merge-out/*.log
            tests/.tmp/kcov-merge-out/**/*.log
            tests/.tmp/kcov-merge-out/*.strace
            tests/.tmp/kcov-merge-out/**/*.strace
          if-no-files-found: warn
