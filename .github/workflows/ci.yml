  test-coverage-line-bats-unit:
    name: test-unit
    runs-on: ubuntu-latest
    needs: [build-devcontainer-test]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image (cached)
        shell: bash
        run: |
          set -euo pipefail
          image="${DEVCONTAINER_IMAGE_BASE}:ci-coverage-${{ env.IMAGE_TAG }}"
          for i in {1..12}; do
            if docker pull "$image"; then
              docker tag "$image" "${DEVCONTAINER_LOCAL_TAG}"
              exit 0
            fi
            sleep 10
          done

          echo "Failed to pull devcontainer image: $image" >&2
          exit 1

      - name: Run kcov bats part in devcontainer
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/.tmp/kcov-part-bats-unit
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kiosk-retropie-devcontainer:ci \
            bash -lc '
              export KCOV_BATS_SUITE=unit
              export KCOV_OUT_DIR=/work/tests/.tmp/kcov-part-bats-unit
              ./scripts/ci.sh coverage-bats
            '

      - name: Upload kcov bats (unit) part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-part-bats-unit
          path: tests/.tmp/kcov-part-bats-unit/*
          if-no-files-found: error

      - name: Upload unit paths log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paths-log-unit
          path: tests/.tmp/kiosk-retropie-paths.unit.log
          if-no-files-found: warn

